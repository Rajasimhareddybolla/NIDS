apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: bd-html-eks
  region: ap-south-1
  version: "1.31"

iam:
  withOIDC: true

managedNodeGroups:
  - name: html-workers
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20
    labels:
      workload: html-site
    tags:
      app: bd-html-site
      owner: bd

apiVersion: v1
kind: Namespace
metadata:
  name: bd-html
  labels:
    app.kubernetes.io/name: bd-html-site
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bd-html-content
  namespace: bd-html
  labels:
    app.kubernetes.io/name: bd-html-site
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="pragma" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <title>NIDS Benchmark Results</title>
        <style>
          :root {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f8fafc;
          }

          * {
            box-sizing: border-box;
          }

          body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            background:
              radial-gradient(circle at top left, rgba(56, 189, 248, 0.28), transparent 34rem),
              radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.22), transparent 30rem),
              #08111f;
          }

          main {
            width: min(1120px, calc(100% - 48px));
            margin: 48px 0;
            padding: 48px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.76);
            box-shadow: 0 24px 90px rgba(0, 0, 0, 0.38);
          }

          .banner {
            margin-bottom: 28px;
            padding: 18px 20px;
            border-radius: 18px;
            background: #16a34a;
            color: #052e16;
            font-size: 1.1rem;
            font-weight: 800;
          }

          .eyebrow {
            margin: 0 0 16px;
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
          }

          h1 {
            margin: 0;
            font-size: clamp(2.4rem, 6vw, 4.8rem);
            line-height: 0.95;
          }

          p {
            max-width: 680px;
            color: #cbd5e1;
            font-size: 1.1rem;
            line-height: 1.7;
          }

          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            margin-top: 34px;
          }

          .card {
            padding: 22px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 20px;
            background: rgba(2, 6, 23, 0.42);
          }

          .metric {
            margin: 0;
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 800;
          }

          .label {
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.45;
          }

          .section {
            margin-top: 34px;
            padding-top: 28px;
            border-top: 1px solid rgba(148, 163, 184, 0.22);
          }

          ul {
            margin: 14px 0 0;
            padding-left: 20px;
            color: #cbd5e1;
            line-height: 1.7;
          }

          .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.14);
            color: #bbf7d0;
            font-weight: 700;
          }

          .dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 20px #22c55e;
          }
        </style>
      </head>
      <body>
        <main>
          <div class="banner">Kubernetes deployment is live and serving benchmark results.</div>
          <p class="eyebrow">NIDS Benchmark Dashboard on EC2 Kubernetes</p>
          <h1>Hybrid NIDS results deployed live.</h1>
          <p>
            This page is served by nginx on a k3s Kubernetes cluster running on
            AWS EC2. It summarizes the strongest results from the experiment and
            implementation reports for the network intrusion detection system.
          </p>
          <div class="grid" aria-label="Benchmark metrics">
            <article class="card">
              <p class="metric">2.83M</p>
              <p class="label">CIC-IDS rows available for analysis</p>
            </article>
            <article class="card">
              <p class="metric">35</p>
              <p class="label">Final hybrid features: 10 targeted + PCA-25</p>
            </article>
            <article class="card">
              <p class="metric">0.9949</p>
              <p class="label">Attack precision for the selected binary model</p>
            </article>
            <article class="card">
              <p class="metric">0.6343</p>
              <p class="label">Attack F1 at threshold 0.05</p>
            </article>
            <article class="card">
              <p class="metric">96.7%</p>
              <p class="label">Variance retained by PCA-25</p>
            </article>
            <article class="card">
              <p class="metric">300+</p>
              <p class="label">Events/sec observed in warm streaming runs</p>
            </article>
          </div>
          <section class="section">
            <p class="eyebrow">What Was Proven</p>
            <ul>
              <li>Hybrid 10+PCA25 outperformed targeted-only and PCA-only feature sets.</li>
              <li>PCA stabilized around k95 = 25 across 400k, 1.2M, and 2.4M row tests.</li>
              <li>Kafka inference, Mongo incident persistence, campaign aggregation, API endpoints, and dashboard rendering were validated end to end.</li>
              <li>Threshold tuning improved recall while preserving very high precision.</li>
            </ul>
          </section>
          <div class="status">
            <span class="dot" aria-hidden="true"></span>
            Running on EC2 k3s at 13.235.58.110
          </div>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bd-html-site
  namespace: bd-html
  labels:
    app.kubernetes.io/name: bd-html-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bd-html-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bd-html-site
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: html-content
          configMap:
            name: bd-html-content
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bd-html-site
  namespace: bd-html
  labels:
    app.kubernetes.io/name: bd-html-site
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bd-html-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bd-html-site
  namespace: bd-html
  labels:
    app.kubernetes.io/name: bd-html-site
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bd-html-site
                port:
                  name: http

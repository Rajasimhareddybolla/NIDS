global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nids_api"
    metrics_path: /metrics/benchmark
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: "kafka_jmx"
    static_configs:
      - targets: ["localhost:9999"]

  - job_name: "mongodb_exporter"
    static_configs:
      - targets: ["localhost:9216"]

  - job_name: "spark_metrics"
    static_configs:
      - targets: ["localhost:4040"]
